```yaml
version: '3.8'

services:

  clojure-app:
    build: .

    container_name: clojure-app

    ports:
      - "3000:3000"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webshop
      DB_USER:  clojure  
      DB_PASSWORD:  clojure  

    depends_on:
      - postgres

    restart: always

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: clojure
      POSTGRES_USER:  clojure  
      POSTGRES_PASSWORD:  clojure  

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres-data:
```
